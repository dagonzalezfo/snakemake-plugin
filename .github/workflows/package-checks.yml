name: Package checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  package-checks:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.1.6

      - name: Set up Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and check tools
        run: python -m pip install --upgrade . build "twine>=7,<8" ruff pyrefly

      - name: Check package import
        run: python -c "import snakemake_software_deployment_plugin_eessi"

      - name: Check formatting
        run: ruff format --check src tests

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: pyrefly check src tests

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*