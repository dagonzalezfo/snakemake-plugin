[project]
dependencies = []
name = "snakemake-software-deployment-plugin-eessi"
requires-python = ">=3.11,<4.0"
version = "0.1.0"

[[project.authors]]
name = "Danilo Gonzalez"
email = "danilo.gonzalez@doitnowgroup.com"

[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling",]

[project.urls]
Repository = "https://github.com/your/plugin"
Documentation = "https://snakemake.github.io/snakemake-plugin-catalog/plugins/software-deployment/eessi.html"

[tool.pixi.workspace]
channels = [ "conda-forge", "bioconda",]
platforms = [ "linux-64",]

[tool.pixi.tasks]

[tool.coverage.report]
exclude_lines = [ "pass", "\\.\\.\\.",]
fail_under = 90.0

[tool.pixi.pypi-dependencies.snakemake_software_deployment_plugin_eessi]
path = "."
editable = true

[tool.pixi.environments.dev]
features = [ "dev",]
